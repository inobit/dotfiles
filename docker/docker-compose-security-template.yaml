# Docker Compose 安全配置示例
# 参考：https://docs.docker.com/engine/security/

services:
  nginx:
    image: nginx:latest

    # 用户权限（nginx 默认已是 101，显式指定更明确）
    # user: "101:101"

    # Capabilities 控制
    # 大部分容器直接全部移除即可, 少部分比如mysql可能要临时加上CHOWN来初始化
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # 绑定 <1024 端口，按需添加

    # 安全选项
    security_opt:
      - no-new-privileges:true # 禁止提权

    # 只读根文件系统，除了挂载的，按需添加，否则可能导致无法写入
    read_only: true

    # 临时文件系统（配合 read_only）
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1" # 跑满1个核
          memory: 512M
          # 限制进程数（防止 fork 炸弹）
          pids: 100
        reservations:
          memory: 128M

    # 禁用特权模式（默认 false，显式声明更清晰）
    privileged: false

    # 挂载目录（:ro 只读，:rw 可写）
    volumes:
      - ./logs:/var/log/nginx:rw
      - ./html:/usr/share/nginx/html:ro

    # 网络隔离（可选）
    networks:
      - internal

networks:
  internal:
    internal: true # 禁止外网访问


# ============================================================
# 配置说明：
#
# 1. cap_drop: ALL + cap_add
#    移除所有权限，仅添加必需权限，遵循最小权限原则
#
# 2. no-new-privileges
#    禁止容器进程获取新权限，防止通过 setuid 提权
#
# 3. read_only + tmpfs
#    只读根文件系统，临时目录走内存，防止恶意写入
#
# 4. privileged: false
#    禁用特权模式，默认值，显式声明更清晰
#
# 5. pids_limit
#    限制进程数，防止 fork 炸弹
#
# 6. deploy.resources
#    限制 CPU/内存，防止资源耗尽
#
# 7. networks.internal
#    内网隔离，禁止容器访问外网
#
# ============================================================
# 常用 cap_add 权限（按需添加）：
#
#   NET_BIND_SERVICE  - 绑定 <1024 端口
#   CHOWN             - chown 文件
#   SETGID            - 切换组 ID
#   SETUID            - 切换用户 ID
#   DAC_OVERRIDE      - 绕过文件权限检查
#   FOWNER            - 绕过文件所有者检查
#   KILL              - 发送信号给其他进程
#   NET_RAW           - 使用 raw socket（ping 需要）
#
# ============================================================
# 配合 Docker daemon 安全配置 (/etc/docker/daemon.json)：
#
#   {
#     "userns-remap": "default",
#     "live-restore": true,
#     "userland-proxy": false
#   }
#
# ============================================================
# 挂载目录权限设置（开启 userns-remap 后）：
#
#   宿主机 UID = 基准值(100000，具体看/etc/subuid和docker daemon.json) + 容器内 UID
#   例如：容器内 UID 101 → 宿主机 100101
#
#   chown -R 100101:100101 ./logs
#
# ============================================================
